<style>
body{background:#fff;color:#17233b}

</head><body><nav class="tabs"><div class="tab-group"><button class="tab active" data-mode="quiz">🧠 Quiz (10)</button><button class="tab" data-mode="puzzles">🧩 Puzzles (10)</button><button class="tab" data-mode="rapid">⚡ Rapid Fire</button></div><button class="sound" id="sound">🔊 Sound On</button></nav><main class="wrap"><section id="quiz" class="card"></section><section id="puzzles" class="card" style="display:none"></section><section id="rapid" class="card" style="display:none"></section></main><script>
const svg=(kind,a,b)=>{let shapes='';if(kind==='robot')shapes='<rect x="85" y="45" width="130" height="100" rx="18" fill="#dbeafe" stroke="#2878ff" stroke-width="7"/><circle cx="125" cy="90" r="10" fill="#2878ff"/><circle cx="175" cy="90" r="10" fill="#2878ff"/><path d="M125 120 Q150 135 175 120" fill="none" stroke="#2878ff" stroke-width="6"/><path d="M150 45V25M150 20v-8" stroke="#2878ff" stroke-width="7"/><circle cx="150" cy="10" r="5" fill="#ffb000"/>';if(kind==='circuit')shapes='<path d="M45 95h55m100 0h55M100 95c0-25 25-40 50-40s50 15 50 40" fill="none" stroke="#2878ff" stroke-width="7"/><circle cx="100" cy="95" r="10" fill="#fff" stroke="#2878ff" stroke-width="6"/><circle cx="200" cy="95" r="10" fill="#fff" stroke="#2878ff" stroke-width="6"/><path d="M120 145h60" stroke="#172033" stroke-width="10"/><path d="M140 130v30m20-30v30" stroke="#ff5b5b" stroke-width="5"/>';if(kind==='sensor')shapes='<rect x="65" y="45" width="170" height="105" rx="15" fill="#e9fff7" stroke="#00a878" stroke-width="7"/><circle cx="115" cy="98" r="25" fill="#fff" stroke="#00a878" stroke-width="6"/><path d="M155 78h55M155 98h55M155 118h35" stroke="#00a878" stroke-width="8" stroke-linecap="round"/><path d="M115 55V25" stroke="#00a878" stroke-width="7"/>';if(kind==='resistor')shapes='<path d="M30 105h55l15-25 25 50 25-50 25 50 15-25h55" fill="none" stroke="#2878ff" stroke-width="7"/><path d="M105 55v100M130 55v100M155 55v100" stroke="#ff7a00" stroke-width="9"/>';return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190"><rect width="300" height="190" rx="18" fill="${a||'#f7faff'}"/>${shapes}<text x="150" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#5c677a">${b||''}</text></svg>`)};
const quiz=[
['An embedded system is best described as a computer that…',[['robot','is built into a device to perform a specific job'],['sensor','is always a full desktop computer'],['circuit','only works when connected to the internet'],['resistor','is used only for playing games']],'A','mcq'],
['A robot detects a wall, processes the information, and then stops its motor. Which sequence best matches the idea?',[['sensor','Sense → control → act'],['robot','Act → sense → forget'],['circuit','Resistor → LED → battery'],['resistor','Motor → resistor → sensor']],'A','mcq'],
['Which picture shows the part that can detect something in the robot’s surroundings?',[['sensor','Sensor'],['robot','Motor'],['resistor','Resistor'],['circuit','LED circuit']],'A','visual'],
['Why is a resistor useful when an LED is connected in a circuit?',[['resistor','It helps control the current through the LED'],['sensor','It detects obstacles for the LED'],['robot','It stores the robot program'],['circuit','It makes electricity disappear']],'A','mcq'],
['Fill in the blank: The flow of electric charge is called ________.',[['current','current'],['voltage','voltage'],['resistance','resistance'],['sensor','sensor']],'A','blank'],
['Which statement about voltage is the best match for the workshop concept?',[['circuit','It provides the electrical push that can drive charge'],['robot','It is the physical movement of a motor'],['sensor','It is the color printed on a resistor'],['resistor','It is the program inside a robot']],'A','mcq'],
['A student sees colored bands on a resistor. What are they mainly useful for identifying?',[['resistor','The resistor’s value'],['robot','The robot’s software version'],['sensor','The sensor’s detection range'],['circuit','The battery’s age']],'A','mcq'],
['Which picture best represents a smart device containing an embedded system?',[['sensor','A microwave controller'],['robot','A wooden ruler'],['circuit','A paper notebook'],['resistor','A plain spoon']],'A','visual'],
['Before powering a newly built circuit, what should a careful student do first?',[['circuit','Check the connections and component ratings'],['robot','Touch every connection to test it'],['sensor','Skip checking and power it immediately'],['resistor','Remove every resistor']],'A','mcq'],
['Fill in the blank: A component that opposes the flow of electric charge is a ________.',[['resistor','resistor'],['sensor','sensor'],['motor','motor'],['battery','battery']],'A','blank']
];
const imgMap={robot:'robot',circuit:'circuit',sensor:'sensor',resistor:'resistor'};
let qi=0,chosen=null,score=0,quizState=[];
function renderQuiz(){
 const el=document.querySelector('#quiz');
 if(qi>=quiz.length){
   el.innerHTML=`<div class="result"><div class="score">${score}/10</div><h2>${score>=8?'🏆 Engineering Master!':score>=5?'🚀 Great work!':'🔧 Keep experimenting!'}</h2><p>You completed the mixed concept challenge.</p><button class="btn primary" onclick="qi=0;score=0;quizState=[];renderQuiz();sfx('start')">Play Again</button></div>`;
   sfx('win');
   return
 }
 const [q,opts,ans,type]=quiz[qi];
 chosen=null;
 quizState=quizState||[];
 const badge=type==='visual'?'VISUAL CHALLENGE':type==='blank'?'FILL IN THE BLANK':'MULTIPLE CHOICE';
 const body=type==='blank'
 ? `<div class="fill-blank-wrap"><input id="blankInput" autocomplete="off" placeholder="Type your answer…"><button class="btn secondary" id="checkBlank">Check</button></div>`
 : `<div class="options">${opts.map((o,i)=> type==='visual'
   ? `<button class="opt visual-option" data-v="${String.fromCharCode(65+i)}"><img src="${svg(imgMap[o[0]],null,o[1])}"><b>${String.fromCharCode(65+i)}. ${o[1]}</b></button>`
   : `<button class="opt" data-v="${String.fromCharCode(65+i)}"><b>${String.fromCharCode(65+i)}.</b> ${o[1]}</button>`).join('')}</div>`;

 const nav=quiz.map((_,i)=>{
   const state=quizState[i];
   const cls=i===qi?'current':state===true?'correct':state===false?'wrong':'';
   const label=state===true?'✓':state===false?'✕':String(i+1);
   return `<button class="qnum ${cls}" ${i===qi?'disabled':''} onclick="goQuestion(${i})">${label}</button>`
 }).join('');

 el.innerHTML=`<div class="quiz-layout">
   <div class="quiz-main">
     <div class="quiz-card">
       <div class="quiz-type-badge">${badge}</div>
       <span class="small" style="margin-left:28px">QUESTION ${qi+1} OF 10</span>
       <div class="progress"><i style="width:${((qi+1)/10)*100}%"></i></div>
       <div class="qtitle">${q}</div>
       ${body}
       <div class="feedback" id="fb"></div>
       <div class="actions">
         <button class="btn secondary" onclick="if(qi>0){qi--;renderQuiz();sfx('click')}">← Back</button>
         <button class="btn primary" id="next" style="display:none">${qi===9?'Finish Quiz':'Next Question  →'}</button>
       </div>
     </div>
   </div>
   <aside class="quiz-side">
     <h3>Questions</h3>
     <div class="q-grid">${nav}</div>
     <div class="legend">
       <h4>Legend</h4>
       <div class="legend-row"><span class="legend-dot green">✓</span> Answered Correct</div>
       <div class="legend-row"><span class="legend-dot red">×</span> Answered Incorrect</div>
       <div class="legend-row"><span class="legend-dot blue"></span> Current Question</div>
       <div class="legend-row"><span class="legend-dot"></span> Not Attempted</div>
     </div>
     <div class="quick-tip"><strong>💡 Quick Tip</strong><br><br>Think about what each component does before choosing your answer.</div>
   </aside>
 </div>
 <div class="quiz-footer"><span>🎉 Answer the question, see the result, then click Next to continue!</span><span>🔊 Sound effects on</span></div>`;

 function showResult(isCorrect){
   quizState[qi]=isCorrect;
   const fb=document.querySelector('#fb');
   const next=document.querySelector('#next');
   document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(isCorrect){
     score++;
     const selectedButton=document.querySelector('.opt.selected');
     if(selectedButton) selectedButton.classList.add('correct-option');
     fb.innerHTML='<strong>🎉 Correct!</strong><br>Excellent! You spotted the engineering idea.';
     fb.style.display='block'; fb.style.background='#effcf4'; fb.style.borderColor='#b9e5c7'; fb.style.color='#166b39';
     sfx('correct');
   }else{
     const correctLabel=opts.find(x=>x[0]===ans)?.[1]||'the correct concept';
     fb.innerHTML='<strong>💡 Not quite!</strong><br>That’s not the right answer.';
     fb.style.display='block'; fb.style.background='#fff4f4'; fb.style.borderColor='#f1b5b5'; fb.style.color='#c23b3b';
     const correctButton=document.querySelector('.opt[data-v="'+ans+'"]');
     if(correctButton) correctButton.classList.add('correct-option');
     fb.insertAdjacentHTML('afterend','<div class="correct-answer">✓ Correct Answer: '+correctLabel+'</div>');
     sfx('wrong');
   }
   next.style.display='inline-block';
   next.onclick=()=>{qi++;renderQuiz();sfx('next')};
   renderQuestionStatus();
 }
 function renderQuestionStatus(){
   document.querySelectorAll('.qnum').forEach((b,i)=>{
     const st=quizState[i];
     b.classList.remove('current','correct','wrong');
     if(i===qi)b.classList.add('current');
     else if(st===true)b.classList.add('correct');
     else if(st===false)b.classList.add('wrong');
     b.textContent=st===true?'✓':st===false?'✕':String(i+1);
   });
 }
 if(type==='blank'){
   document.querySelector('#checkBlank').onclick=()=>{
     const v=(document.querySelector('#blankInput').value||'').trim().toLowerCase();
     if(!v){sfx('error');document.querySelector('#blankInput').focus();return}
     const accepted=(opts.find(x=>x[0]===ans)?.[1]||'').toLowerCase();
     document.querySelector('#blankInput').disabled=true;
     document.querySelector('#checkBlank').disabled=true;
     showResult(v===accepted);
   };
   document.querySelector('#blankInput').addEventListener('keydown',e=>{
     if(e.key==='Enter')document.querySelector('#checkBlank').click();
   });
 }else{
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
     if(b.disabled)return;
     chosen=b.dataset.v;
     document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
     b.classList.add('selected');
     sfx('click');
     showResult(chosen===ans);
   });
 }
}
function goQuestion(n){
 if(n===qi)return;
 if(quizState && quizState[n]!==undefined){qi=n;renderQuiz();sfx('click')}
}

const puzzles=[
['Circuit Detective','An LED circuit is built, but the LED should not be connected directly to the power source. Which build is the sensible choice?',['Power → LED → resistor → return','Power → resistor → LED → return','Power → motor only','Power → sensor only'],1,'circuit'],
['Robot Brain','A small robot must sense an obstacle, decide what to do, then move. Which chain makes the most sense?',['Motor → sensor → decision','Sensor → control system → motor','Resistor → battery → sensor','LED → motor → battery'],1,'robot'],
['Smart Device Spotter','Which object is the best example of a device with an embedded computer doing a specific job?',['Microwave controller','Blank notebook','Wooden ruler','Water bottle'],0,'sensor'],
['Resistor Mission','You need to identify the component whose job is to oppose/control current in a circuit. Pick it.',['Resistor','Sensor','Motor','Antenna'],0,'resistor'],
['Voltage Detective','Which description matches voltage most closely in the workshop?',['Electrical push','Charge flow','Opposition to flow','A stored program'],0,'circuit'],
['Current Detective','Which description matches current?',['Electrical push','Flow of electric charge','Resistance value','Robot instruction'],1,'circuit'],
['Safety Scout','Which action is the safest classroom habit when working with circuits?',['Connect everything immediately','Check the circuit before powering it','Touch bare connections while powered','Ignore component ratings'],1,'robot'],
['Color-Code Crack','A resistor has colored bands. What are you trying to decode?',['Resistance value','Robot name','Sensor location','Motor direction'],0,'resistor'],
['Creator Mindset','The workshop says students should become creators rather than only users. Which action fits that idea?',['Build and test a smart device','Only watch videos','Avoid circuits','Never change a design'],0,'robot'],
['Find the Missing Role','A smart robot can move but cannot react to its surroundings. Which role is most likely missing?',['Sensor','Resistor','LED indicator only','Battery label'],0,'sensor']
];
function puzzleVisual(title){
 const t=title.toLowerCase();
 if(t.includes('circuit')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="LED circuit"><rect width="700" height="180" rx="18" fill="#f7fbff"/><circle cx="90" cy="90" r="30" fill="#ffd86b"/><text x="90" y="96" text-anchor="middle" font-size="22">🔋</text><path d="M120 90 H245 M455 90 H580" stroke="#2878ff" stroke-width="7"/><rect x="245" y="68" width="80" height="44" rx="8" fill="#f4b942"/><path d="M265 68v44 M285 68v44 M305 68v44" stroke="#8b5a00" stroke-width="5"/><circle cx="410" cy="90" r="27" fill="#ff6b8a"/><path d="M325 90h58 M437 90h18 V140 H90 V120" fill="none" stroke="#2878ff" stroke-width="7"/><text x="410" y="98" text-anchor="middle" font-size="22">💡</text></svg>`;
 if(t.includes('robot brain')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="robot sensing and moving"><rect width="700" height="180" rx="18" fill="#f7fbff"/><g transform="translate(260 30)"><rect x="0" y="20" width="180" height="105" rx="28" fill="#dbeafe" stroke="#2878ff" stroke-width="5"/><circle cx="52" cy="70" r="14" fill="#2878ff"/><circle cx="128" cy="70" r="14" fill="#2878ff"/><path d="M55 100 Q90 118 125 100" fill="none" stroke="#2878ff" stroke-width="6"/><path d="M90 20V0" stroke="#2878ff" stroke-width="5"/><circle cx="90" cy="0" r="8" fill="#ffb84d"/><circle cx="-12" cy="150" r="25" fill="#64748b"/><circle cx="192" cy="150" r="25" fill="#64748b"/></g><text x="95" y="45" font-size="42">👁️</text><text x="585" y="45" font-size="42">⚙️</text></svg>`;
 if(t.includes('smart device')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="smart appliance"><rect width="700" height="180" rx="18" fill="#f7fbff"/><rect x="215" y="25" width="270" height="130" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/><rect x="250" y="55" width="200" height="55" rx="10" fill="#fff"/><circle cx="270" cy="138" r="8" fill="#2878ff"/><circle cx="300" cy="138" r="8" fill="#2878ff"/><text x="350" y="94" text-anchor="middle" font-size="32">🍲</text><text x="70" y="105" font-size="48">🧠</text><text x="585" y="105" font-size="48">⚙️</text></svg>`;
 if(t.includes('resistor')||t.includes('color')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="resistor with color bands"><rect width="700" height="180" rx="18" fill="#f7fbff"/><path d="M100 90H245 M455 90H600" stroke="#64748b" stroke-width="8"/><rect x="245" y="55" width="210" height="70" rx="18" fill="#e7d2a4" stroke="#9a7b42" stroke-width="4"/><path d="M290 55v70 M330 55v70 M370 55v70 M410 55v70" stroke-width="15"/><text x="350" y="35" text-anchor="middle" font-size="26">🎨 Resistor</text></svg>`;
 if(t.includes('voltage')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="battery voltage"><rect width="700" height="180" rx="18" fill="#f7fbff"/><rect x="280" y="45" width="140" height="90" rx="12" fill="#dbeafe" stroke="#2878ff" stroke-width="5"/><path d="M420 75h20v30h-20" fill="none" stroke="#2878ff" stroke-width="5"/><text x="350" y="103" text-anchor="middle" font-size="34">⚡</text><text x="120" y="105" font-size="50">➕</text><text x="530" y="105" font-size="50">➖</text></svg>`;
 if(t.includes('current')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="electric current flow"><rect width="700" height="180" rx="18" fill="#f7fbff"/><path d="M100 90 H600" stroke="#2878ff" stroke-width="8" stroke-linecap="round"/><path d="M190 75l25 15-25 15z M330 75l25 15-25 15z M470 75l25 15-25 15z" fill="#ffb84d"/><text x="350" y="48" text-anchor="middle" font-size="27">Charge Flow →</text></svg>`;
 if(t.includes('safety')) return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="circuit safety"><rect width="700" height="180" rx="18" fill="#f7fbff"/><path d="M350 25l70 25v45c0 35-28 57-70 70-42-13-70-35-70-70V50z" fill="#dbeafe" stroke="#2878ff" stroke-width="5"/><path d="M350 58v50" stroke="#2878ff" stroke-width="9"/><circle cx="350" cy="125" r="6" fill="#2878ff"/><text x="95" y="112" font-size="54">🔌</text><text x="555" y="112" font-size="54">🛡️</text></svg>`;
 return `<svg viewBox="0 0 700 180" class="puzzle-svg" aria-label="robotics"><rect width="700" height="180" rx="18" fill="#f7fbff"/><text x="350" y="112" text-anchor="middle" font-size="82">🤖</text></svg>`;
}
function renderPuzzles(){
 document.querySelector('#puzzles').innerHTML=`<h2>🧩 Engineering Puzzle Lab</h2><p class="small">Solve all 10. No heavy calculations — just smart decisions.</p><div class="puzzle-grid">${puzzles.map((p,i)=>`<div class="puzzle"><div class="puzzle-visual">${puzzleVisual(p[0])}</div><h3>${i+1}. ${p[0]}</h3><p>${p[1]}</p><div class="choices">${p[2].map((x,j)=>`<button class="chip" onclick="puzzlePick(${i},${j},this)">${x}</button>`).join('')}</div><div class="small" id="pf${i}" style="margin-top:12px"></div></div>`).join('')}</div>`
}
function puzzlePick(i,j,b){
 const p=puzzles[i],fb=document.querySelector('#pf'+i);
 document.querySelectorAll('#puzzles .puzzle')[i].querySelectorAll('.chip').forEach(x=>x.disabled=true);
 if(j===p[3]){fb.innerHTML='<strong>🎉 Correct!</strong><br>Excellent engineering choice.';fb.style.color='#138a52';sfx('correct')}
 else{fb.innerHTML='<strong>💡 Not quite!</strong><br>Think about the job of each component.';fb.style.color='#d34d4d';sfx('wrong')}
}

const rapid=['What is the “brain” role in a smart device called?','Which component senses the environment?','What does a resistor oppose?','What does current describe?','What does voltage describe?','What law links voltage, current and resistance?','What do resistor color bands help identify?','Name one real-life embedded system from the workshop context.','What should you do before powering a new circuit?','Are you ready to become a creator?'];let ri=0,rtimer=null,running=false;function renderRapid(){document.querySelector('#rapid').innerHTML=`<div class="rapid"><h2>⚡ Rapid Fire</h2><p>10 lightning questions • 30 seconds</p><div class="timer" id="timer">30</div><div class="rapidbox"><h2 id="rq">Press Start!</h2><button class="btn primary" id="startRapid">Start Round</button><p class="small" id="rmsg">Type or say your answer with your team, then tap Next.</p><button class="btn secondary" id="rnext" style="display:none">Next ⚡</button></div></div>`;document.querySelector('#startRapid').onclick=startRapid;document.querySelector('#rnext').onclick=nextRapid}function startRapid(){ri=0;running=true;document.querySelector('#startRapid').style.display='none';document.querySelector('#rnext').style.display='inline-block';document.querySelector('#rq').textContent=rapid[ri];let t=30;document.querySelector('#timer').textContent=t;sfx('start');clearInterval(rtimer);rtimer=setInterval(()=>{t--;document.querySelector('#timer').textContent=t;if(t<=5)sfx('tick');if(t<=0){clearInterval(rtimer);running=false;sfx('wrong');document.querySelector('#rmsg').textContent='⏰ Time! Restart for another round.'}},1000)}function nextRapid(){if(!running)return;ri++;if(ri>=rapid.length){clearInterval(rtimer);running=false;document.querySelector('#rq').textContent='🎉 Rapid Fire Complete!';document.querySelector('#rnext').style.display='none';sfx('win');return}document.querySelector('#rq').textContent=rapid[ri];sfx('next')}
let audioOn=true,ctx;
function ac(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();return ctx}
function tone(freq,dur,type='sine',gain=.05,delay=0){
 if(!audioOn)return;
 const c=ac(),o=c.createOscillator(),g=c.createGain();
 g.gain.setValueAtTime(.0001,c.currentTime+delay);
 g.gain.exponentialRampToValueAtTime(gain,c.currentTime+delay+.01);
 g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+dur);
 o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);
 o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.03)
}
function sfx(k){
 if(!audioOn)return;
 if(k==='click'){tone(520,.05,'square',.025)}
 if(k==='correct'){tone(523,.10,'sine',.055);tone(659,.10,'sine',.055,.10);tone(784,.18,'sine',.06,.20);tone(1047,.24,'sine',.045,.34)}
 if(k==='wrong'){tone(300,.11,'triangle',.05);tone(220,.16,'triangle',.045,.12);tone(165,.22,'triangle',.035,.29)}
 if(k==='error'){tone(120,.12,'square',.04);tone(90,.18,'square',.03,.13)}
 if(k==='start'){tone(440,.08,'sine',.04);tone(554,.08,'sine',.04,.09);tone(659,.08,'sine',.04,.18);tone(880,.15,'sine',.045,.27)}
 if(k==='next'){tone(620,.06,'triangle',.035);tone(820,.08,'triangle',.035,.07)}
 if(k==='tick'){tone(950,.045,'square',.025)}
 if(k==='win'){tone(523,.10,'sine',.05);tone(659,.10,'sine',.05,.11);tone(784,.10,'sine',.05,.22);tone(1047,.28,'sine',.055,.33)}
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');let m=t.dataset.mode;['quiz','puzzles','rapid'].forEach(x=>document.querySelector('#'+x).style.display=x===m?'block':'none');sfx('click')});document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'🔊 Sound On':'🔇 Sound Off';if(audioOn)sfx('start')};renderQuiz();renderPuzzles();renderRapid();
</script></body></html>
