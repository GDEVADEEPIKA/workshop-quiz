</head><body><nav class="tabs"><div class="tab-group"><button class="tab active" data-mode="quiz">🧠 Quiz (10)</button><button class="tab" data-mode="puzzles">🧩 Puzzles (10)</button><button class="tab" data-mode="rapid">⚡ Rapid Fire</button></div><button class="sound" id="sound">🔊 Sound On</button></nav><main class="wrap"><section id="quiz" class="card"></section><section id="puzzles" class="card" style="display:none"></section><section id="rapid" class="card" style="display:none"></section></main><script>
let audioOn=true, audioCtx=null;
function getAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq=700,duration=.12,type='sine',volume=.16){
  if(!audioOn)return;
  try{
    const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(volume,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration);
  }catch(e){}
}
function sfx(kind){
  if(!audioOn)return;
  if(kind==='correct'){beep(880,.12,'sine',.25);setTimeout(()=>beep(1175,.18,'sine',.25),90)}
  else if(kind==='wrong'){beep(220,.18,'sawtooth',.25);setTimeout(()=>beep(165,.22,'sawtooth',.22),120)}
  else if(kind==='tick'){beep(1050,.11,'square',.52)}
  else if(kind==='countdown'){
    beep(700,.16,'square',.42);
    setTimeout(()=>beep(900,.16,'square',.46),180);
    setTimeout(()=>beep(1150,.24,'square',.52),360);
  }
  else if(kind==='timeup'){
    beep(180,.30,'sawtooth',.50);
    setTimeout(()=>beep(140,.38,'sawtooth',.45),190);
    setTimeout(()=>beep(110,.42,'sawtooth',.40),430);
  }
  else if(kind==='start'){beep(660,.12,'sine',.30);setTimeout(()=>beep(880,.16,'sine',.32),100)}

}

 function showResult(isCorrect){
   // Only score the question once. Going Next without answering leaves it undefined.
   if(quizState[qi]!==undefined) return;
   quizState[qi]=isCorrect;
   if(type==='blank'){
     quizAnswers[qi]=(document.querySelector('#blankInput')?.value||'').trim();
   }else{
     quizAnswers[qi]=chosen||'';
   }
   const fb=document.querySelector('#fb');
   const next=document.querySelector('#next');
   document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(type==='blank'){
     const inp=document.querySelector('#blankInput');

     if(inp)inp.disabled=true;
     if(check)check.disabled=true;
   }
   if(isCorrect){
     score++;
     const selectedButton=document.querySelector('.opt.selected');
     if(selectedButton) selectedButton.classList.add('correct-option');
     fb.innerHTML='<strong>✅ Correct answer!</strong><br>Great job!';

     const correctButton=document.querySelector('.opt[data-v="'+ans+'"]');

     sfx('wrong');
   }
   renderQuestionStatus();
 }
 function renderQuestionStatus(){
   document.querySelectorAll('.qnum').forEach((b,i)=>{
     const st=quizState[i];
     b.classList.remove('current','correct','wrong');
     if(i===qi)b.classList.add('current');
     else if(st===true)b.classList.add('correct');
     else if(st===false)b.classList.add('wrong');
     b.textContent=st===true?'✓':st===false?'✕':String(i+1);
   });
 }
 document.querySelector('#next').onclick=()=>{
   if(qi<quiz.length){ qi++; renderQuiz(); sfx('next'); }
 };
 if(type==='blank'){

     const v=(document.querySelector('#blankInput').value||'').trim().toLowerCase();
     if(!v){sfx('error');document.querySelector('#blankInput').focus();return}
     const correctIndex=ans.charCodeAt(0)-65;
     const accepted=(opts[correctIndex]?.[1]||'').trim().toLowerCase();
     showResult(v===accepted);
   };
   document.querySelector('#blankInput').addEventListener('keydown',e=>{
     if(e.key==='Enter')document.querySelector('#checkBlank').click();
   });
 }else{
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
     if(b.disabled || quizState[qi]!==undefined)return;
     chosen=b.dataset.v;
     document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
     b.classList.add('selected');
     showResult(chosen===ans);
   });
 }
}

}
function goQuestion(n){

}

   return `<div class="interaction-label">👍 YES OR NO</div>
   <p class="interaction-help">Think about the statement, then choose your answer.</p>
   <div class="yn-grid"><button class="yn-card" onclick="puzzleInput=0;selectYN(this)">YES</button><button class="yn-card" onclick="puzzleInput=1;selectYN(this)">NO</button></div>
   <button class="btn primary small-submit" onclick="submitPuzzle()">Check</button>`;
 }
 if(mode==='sort'){
   if(!Array.isArray(puzzleInput)) puzzleInput=choices.map((_,i)=>i);
   return `<div class="interaction-label">↕️ SORT THE STEPS</div>
   <p class="interaction-help">Move the steps until they form the most sensible order.</p>
   <div class="arrange-list">${puzzleInput.map((idx,pos)=>`<div class="arrange-row"><span class="arrange-number">${pos+1}</span><span class="arrange-text">${choices[idx]}</span><button class="move-btn" onclick="moveArrange(${pos},-1)" ${pos===0?'disabled':''}>↑</button><button class="move-btn" onclick="moveArrange(${pos},1)" ${pos===puzzleInput.length-1?'disabled':''}>↓</button></div>`).join('')}</div>
   <button class="btn primary small-submit" onclick="submitArrange()">Check Order</button>`;
 }
 if(mode==='tap'){
   return `<div class="interaction-label">👆 TAP THE BEST CLUE</div>
   <p class="interaction-help">Tap the item most directly connected to the situation.</p>
   <div class="tap-board">${choices.map((x,j)=>`<button class="tap-target" onclick="puzzleInput=${j};document.querySelectorAll('.tap-target').forEach((b,k)=>b.classList.toggle('selected',k===${j}))">${x}</button>`).join('')}</div>
   <button class="btn primary small-submit" onclick="submitPuzzle()">Check</button>`;
 }
 if(mode==='sequence'){
   return `<div class="interaction-label">🎯 PICK THE CLUE</div>
   <p class="interaction-help">Choose the workshop clue that unlocks this puzzle.</p>
   <div class="sequence-grid">${choices.map((x,j)=>`<button class="sequence-card" onclick="puzzleInput=${j};document.querySelectorAll('.sequence-card').forEach((b,k)=>b.classList.toggle('selected',k===${j}))">${String.fromCharCode(65+j)}<span>${x}</span></button>`).join('')}</div>
   <button class="btn primary small-submit" onclick="submitPuzzle()">Check</button>`;
 }
 return `<div class="interaction-label">🧩 DRAG & DROP</div>
 <p class="interaction-help">Drag the best component set into the box.</p>
 <div class="drag-bank">${choices.map((x,j)=>`<div class="drag-item" draggable="true" ondragstart="dragStart(event,${j})">${x}<span>⠿</span></div>`).join('')}</div>
 <div class="drop-zone" ondragover="event.preventDefault()" ondrop="dropAnswer(event)">${puzzleInput===null?'<span>Drop your answer here</span>':`<strong>${choices[puzzleInput]}</strong>`}</div>
 ${puzzleInput!==null?`<button class="btn primary small-submit" onclick="submitPuzzle()">Check</button>`:''}`;
}

function renderPuzzles(){ if(!puzzles[pi]){pi=0;} 
 const p=puzzles[pi];
 const state=puzzleState[pi];
 const answer=puzzleAnswers[pi];
 const correctText=(puzzleModes[pi]==='match')
   ? p[3].map(i=>p[2][i]).join(' | ')
   : (Array.isArray(p[3]) ? p[3].map(i=>p[2][i]).join(' → ') : p[2][p[3]]);
 const yourPuzzleAnswer=Array.isArray(answer)
   ? (puzzleModes[pi]==='match'
      ? answer.map((v,j)=>v>=0?(p[2][j].split(' = ')[0]+' → '+(p[2][v].split(' = ')[1]||p[2][v])):'Not selected').join(' | ')
      : answer.map(i=>p[2][i]).join(' → '))
   : (answer===null?'Not attempted':p[2][answer]);

 document.querySelector('#puzzles').innerHTML=`
 <div class="puzzle-page">
   <div class="puzzle-top">
     <div>
       <div class="quiz-type-badge">PUZZLE ${pi+1} OF ${puzzles.length}</div>
       <div class="puzzle-progress"><span style="width:${((pi+1)/puzzles.length)*100}%"></span></div>
     </div>
     <div class="puzzle-counter">${pi+1} / ${puzzles.length}</div>
   </div>
   <div class="puzzle-main">
     <div class="puzzle-content">
       <div class="puzzle-visual">${puzzleVisual(p[0])}</div>
       <h2>${pi+1}. ${p[0]}</h2>
       <p class="puzzle-question">${p[1]}</p>

       ${state===null ? puzzleModeMarkup(p) : `
         <div class="answered-box">
           <div class="your-answer"><strong>Your answer:</strong> ${yourPuzzleAnswer}</div>
           <div class="${state?'answer-good':'answer-bad'}">${state?'✓ Correct!':'✕ Wrong!'}</div>
           <div class="p-correct-answer"><strong>Correct answer: ${correctText}</strong></div>
         </div>
       `}

       ${state!==null ? `
       <div class="puzzle-feedback ${state?'p-correct':'p-wrong'}">
         <strong>${state?'Great job!':'Not quite!'}</strong>
         <div>${state?'You solved this puzzle correctly.':'That answer is not correct.'}</div>
         <div>Correct answer: <strong>${correctText}</strong></div>
       </div>` : ''}

       <div class="puzzle-actions">
         ${pi>0?`<button class="btn secondary" onclick="puzzleBack()">← Back</button>`:'<div></div>'}
         <button class="btn primary" onclick="puzzleNext()">${pi===puzzles.length-1?'Finish Puzzles':'Next Puzzle →'}</button>
       </div>
     </div>
     <aside class="puzzle-side">
       <h3>Puzzles</h3>
       <div class="puzzle-nav">
         ${puzzles.map((_,i)=>`<button class="${i===pi?'current-puzzle':''} ${puzzleState[i]===true?'done-correct':''} ${puzzleState[i]===false?'done-wrong':''}" onclick="goPuzzle(${i})">${puzzleState[i]===true?'✓':puzzleState[i]===false?'✕':i+1}</button>`).join('')}
       </div>
       <div class="puzzle-legend">
         <div>🟢 Answered Correct</div><div>🔴 Answered Incorrect</div>
         <div>🔵 Current Puzzle</div><div>⚪ Not Attempted</div>
       </div>
     </aside>
   </div>
 </div>`;
}

function setCheckAnswer(el){
 if(el.checked){
   document.querySelectorAll('input[name="pcheck"]').forEach(x=>{if(x!==el)x.checked=false});
   puzzleInput=Number(el.value);
 }else puzzleInput=null;
}
function dragStart(e,j){e.dataTransfer.setData('text/plain',j)}
function dropAnswer(e){
 e.preventDefault();
 const j=Number(e.dataTransfer.getData('text/plain'));
 if(Number.isInteger(j)){puzzleInput=j;renderPuzzles()}
}
function dragTouchStart(e,j){puzzleInput=j}
function moveArrange(pos,dir){
 if(!Array.isArray(puzzleInput)) return;
 const next=pos+dir;
 if(next<0 || next>=puzzleInput.length)return;
 [puzzleInput[pos],puzzleInput[next]]=[puzzleInput[next],puzzleInput[pos]];
 renderPuzzles();
}
function submitArrange(){
 if(!Array.isArray(puzzleInput))return;
 puzzleAnswers[pi]=puzzleInput.slice();
 puzzleState[pi]=JSON.stringify(puzzleInput)===JSON.stringify(puzzles[pi][3]);
 sfx(puzzleState[pi]?'correct':'wrong');
 renderPuzzles();
}
function selectYN(el){document.querySelectorAll('.yn-card').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function toggleMulti(el){
 if(!Array.isArray(puzzleInput)) puzzleInput=[];
 const n=Number(el.value);
 if(el.checked && !puzzleInput.includes(n)) puzzleInput.push(n);
 if(!el.checked) puzzleInput=puzzleInput.filter(x=>x!==n);
}
function submitMulti(){
 puzzleAnswers[pi]=Array.isArray(puzzleInput)?puzzleInput.slice():[];
 const target=puzzles[pi][3].slice().sort((a,b)=>a-b);
 const got=puzzleAnswers[pi].slice().sort((a,b)=>a-b);
 puzzleState[pi]=JSON.stringify(got)===JSON.stringify(target);
 sfx(puzzleState[pi]?'correct':'wrong'); renderPuzzles();
}
function submitMatch(){
 const got=[];
 for(let j=0;j<puzzles[pi][2].length;j++){
   const el=document.getElementById('match'+j);
   got.push(el && el.value!=='' ? Number(el.value) : -1);
 }
 puzzleAnswers[pi]=got;
 puzzleState[pi]=got.every((v,j)=>v===j);
 sfx(puzzleState[pi]?'correct':'wrong'); renderPuzzles();
}
function submitSlider(){puzzleInput=Number(document.getElementById('pSlider').value);submitPuzzle()}
function submitPuzzle(){
 if(puzzleInput===null || puzzleState[pi]!==null)return;
 puzzleAnswers[pi]=puzzleInput;
 puzzleState[pi]=(puzzleInput===puzzles[pi][3]);
 sfx(puzzleState[pi]?'correct':'wrong');
 renderPuzzles();
}

function puzzleNext(){
 if(pi<puzzles.length-1){pi++;puzzleInput=null;renderPuzzles();sfx('next')}
 else{
   const correct=puzzleState.filter(x=>x===true).length;
   const attempted=puzzleState.filter(x=>x!==null).length;
   document.querySelector('#puzzles').innerHTML=`
   <div class="puzzle-finish">
     <div class="score">${correct}/${puzzles.length}</div>
     <h2>🧩 Puzzles Complete!</h2>
     <p>You answered ${attempted} of ${puzzles.length} puzzles.</p>
     <div class="puzzle-review"><h3>Quick Review</h3>
       ${puzzles.map((p,i)=>`<div class="p-review ${puzzleState[i]===true?'pr-correct':puzzleState[i]===false?'pr-wrong':'pr-unanswered'}">
         <strong>${i+1}. ${p[0]}</strong>
         <span>${puzzleState[i]===true?'✓ Correct':puzzleState[i]===false?'✕ Wrong':'○ Not Attempted'}</span>
         <small>Correct answer: ${p[2][p[3]]}</small>
       </div>`).join('')}
     </div>
     <button class="btn primary" onclick="pi=0;puzzleState=Array(10).fill(null);puzzleAnswers=Array(10).fill(null);puzzleInput=null;renderPuzzles()">Play Puzzles Again</button>
   </div>`;
   sfx('win');
 }
}
function puzzleBack(){if(pi>0){pi--;puzzleInput=puzzleAnswers[pi]??(pi===0?[0,1,2,3]:null);renderPuzzles();sfx('next')}}
function goPuzzle(n){pi=n;puzzleInput=puzzleAnswers[n]??(n===0?[0,1,2,3]:null);renderPuzzles()}

const rapid=['What is the “brain” role in a smart device called?','Which component senses the environment?','What does a resistor oppose?','What does current describe?','What does voltage describe?','What law links voltage, current and resistance?','What do resistor color bands help identify?','Name one real-life embedded system from the workshop context.','What should you do before powering a new circuit?','Are you ready to become a creator?'];
const rapidAnswers=['Embedded system','Sensor','Electric current / flow of charge','Flow of electric charge','Electrical push / potential difference','Ohm’s Law','The resistor’s value','A smart device controller','Check the connections and component ratings','Yes — become a creator!'];
let ri=0,rtimer=null,running=false,rapidSeconds=20;

function renderRapid(){
 document.querySelector('#rapid').innerHTML=`<div class="rapid">
   <h2>⚡ Rapid Fire</h2>
   <p>10 lightning questions • 20 seconds each</p>
   <div class="timer" id="timer">30</div>
   <div class="rapidbox">
     <h2 id="rq">${rapid[ri]||'Press Start!'}</h2>
     <button class="btn primary" id="startRapid">${ri===0&&!running?'Start Round':'Start Round'}</button>
     <p class="small" id="rmsg">You have 20 seconds. The countdown will beep during the final 10 seconds.</p>
     <div id="ranswer"></div>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">
       <button class="btn secondary" id="rshow" style="display:none">Show Answer 👀</button>
       <button class="btn secondary" id="rnext" style="display:none">Next ⚡</button>
     </div>
   </div>
 </div>`;
 document.querySelector('#startRapid').onclick=startRapid;
 document.querySelector('#rshow').onclick=showRapidAnswer;
 document.querySelector('#rnext').onclick=nextRapid;
 if(running){
   document.querySelector('#startRapid').style.display='none';
   document.querySelector('#rshow').style.display='inline-block';
   document.querySelector('#rnext').style.display='inline-block';
 }
}

function startRapid(){
 clearInterval(rtimer);
 ri=0;
 running=true;
 renderRapid();
 document.querySelector('#startRapid').style.display='none';
 document.querySelector('#rshow').style.display='inline-block';
 document.querySelector('#rnext').style.display='inline-block';
 sfx('start');
 startRapidTimer();
}

function showRapidAnswer(){
 const answer=document.querySelector('#ranswer');
 const show=document.querySelector('#rshow');
 if(answer)answer.innerHTML='<div class="correct-answer">✓ Correct answer: '+rapidAnswers[ri]+'</div>';
 if(show){
   show.textContent='Answer Shown ✓';
   show.disabled=true;
   show.style.opacity='.7';
 }
 sfx('correct');
}

function startRapidTimer(){
 clearInterval(rtimer);
 rapidSeconds=20;
 const timer=document.querySelector('#timer');
 if(!timer)return;
 timer.textContent='20';
 sfx('countdown');

 rtimer=setInterval(()=>{
   rapidSeconds--;
   const t=document.querySelector('#timer');
   if(t)t.textContent=rapidSeconds;

   if(rapidSeconds>0){
     sfx('tick');
     if(t){
       t.style.transform='scale(1.12)';
       if(rapidSeconds<=10)t.classList.add('countdown-hot');
       t.setAttribute('aria-label',rapidSeconds+' seconds remaining');
     }
     setTimeout(()=>{if(t)t.style.transform='scale(1)'},150);
   }

   if(rapidSeconds<=0){
     clearInterval(rtimer);
     running=false;
     sfx('timeup');
     const msg=document.querySelector('#rmsg');
     const answer=document.querySelector('#ranswer');
     const next=document.querySelector('#rnext');
     if(msg)msg.textContent='⏰ Time is up! Here is the correct answer:';
     if(answer)answer.innerHTML='<div class="correct-answer">✓ Correct answer: '+rapidAnswers[ri]+'</div>';
     const show=document.querySelector('#rshow');
     if(show){show.style.display='inline-block';show.textContent='Answer Shown ✓';show.disabled=true;show.style.opacity='.7';}
     if(next)next.style.display='inline-block';
   }
 },1000);
}

function nextRapid(){
 clearInterval(rtimer);
 ri++;
 if(ri>=rapid.length){
   running=false;
   document.querySelector('#rq').textContent='🎉 Rapid Fire Complete!';
   document.querySelector('#rmsg').textContent='Great job!';
   document.querySelector('#ranswer').innerHTML='';
   document.querySelector('#rnext').style.display='none';
   document.querySelector('#rshow').style.display='none';
   document.querySelector('#startRapid').style.display='inline-block';
   sfx('win');
   return;
 }
 running=true;
 rapidSeconds=20;
 document.querySelector('#rq').textContent=rapid[ri];
 document.querySelector('#rmsg').textContent='You have 20 seconds. The countdown will beep during the final 10 seconds.';
 document.querySelector('#ranswer').innerHTML='';
 const show=document.querySelector('#rshow');
 if(show){show.style.display='inline-block';show.textContent='Show Answer 👀';show.disabled=false;show.style.opacity='1';}
 document.querySelector('#rnext').style.display='inline-block';
 document.querySelector('#timer').textContent='20';
 sfx('next');
 startRapidTimer();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');let m=t.dataset.mode;['quiz','puzzles','rapid'].forEach(x=>document.querySelector('#'+x).style.display=x===m?'block':'none');sfx('click')});document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'🔊 Sound On':'🔇 Sound Off';if(audioOn)sfx('start')};renderQuiz();renderPuzzles();renderRapid();
</script></body></html>
